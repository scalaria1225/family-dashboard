<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>reels test 390x844</title>
<style>
  html,body{margin:0;background:#222;font:12px system-ui;color:#eee}
  #wrap{display:flex;gap:12px;padding:12px}
  iframe{width:390px;height:844px;border:0;border-radius:12px;background:#fff}
  #log{flex:1;max-width:600px;font-family:ui-monospace,monospace;font-size:11px;line-height:1.5;white-space:pre-wrap}
  .e{color:#ff8b8b}
  .w{color:#ffd27a}
</style>
</head>
<body>
<div id="wrap">
  <iframe id="fr" src="./index.html?cb="></iframe>
  <div id="log">log</div>
</div>
<script>
const logEl = document.getElementById('log');
const lines = [];
function log(msg, kind) {
  lines.push((kind ? kind + ': ' : '') + msg);
  logEl.innerHTML = lines.slice(-40).map(l => `<div class="${l.startsWith('ERR') ? 'e' : l.startsWith('WARN') ? 'w' : ''}">${l.replace(/</g,'&lt;')}</div>`).join('');
}
window.__log = log;
const fr = document.getElementById('fr');
fr.src = './index.html?cb=' + Date.now();
fr.addEventListener('load', () => {
  const w = fr.contentWindow;
  w.addEventListener('error', e => log(e.message + ' @' + (e.filename||'').split('/').pop() + ':' + e.lineno, 'ERR'));
  w.addEventListener('unhandledrejection', e => log(String(e.reason && e.reason.message || e.reason), 'ERR'));
  const ce = w.console.error.bind(w.console);
  w.console.error = (...a) => { log(a.map(String).join(' '), 'ERR'); ce(...a); };
  const cw = w.console.warn.bind(w.console);
  w.console.warn = (...a) => { log(a.map(String).join(' '), 'WARN'); cw(...a); };
  log('iframe ' + w.innerWidth + 'x' + w.innerHeight + ' dpr' + w.devicePixelRatio);
});
window.__errs = () => lines.filter(l => l.startsWith('ERR'));
</script>
</body>
</html>
